<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">

  <script>
    (function () {
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      const oldBookBase = "files/applied-biostatistics_bookdown/_book";
      const newBookHome = "https://benchbiostats.com";

      if (path.startsWith(oldBookBase)) {
        window.location.replace(newBookHome + search + hash);
      }
    })();
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      max-width: 700px;
      margin: 80px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Page moved</h1>
  <p>If you are not redirected automatically, go to the new book:</p>
  <p><a href="https://benchbiostats.com">https://benchbiostats.com</a></p>
</body>
</html>
